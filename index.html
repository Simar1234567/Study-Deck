<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>BIO 201 iPad Study Deck</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:700px;margin:auto;padding:24px 18px 60px}h1{font-size:27px}p{color:#cbd5e1;line-height:1.5}.card{background:#202e45;border:1px solid #42526b;border-radius:20px;min-height:270px;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;margin:25px 0;font-size:clamp(23px,5vw,36px);font-weight:650;cursor:pointer;touch-action:manipulation}.card small{display:block;font-size:14px;color:#cbd5e1;font-weight:400;margin-bottom:14px}button{border:0;border-radius:12px;padding:15px 18px;font-size:17px;font-weight:600;min-height:48px;cursor:pointer}button:focus-visible{outline:3px solid #93c5fd}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.controls button:first-child{background:#fecaca;color:#7f1d1d}.controls button:last-child{background:#bbf7d0;color:#14532d}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tools button{background:#334155;color:white}.meta{font-size:14px;color:#cbd5e1}input{width:100%;padding:15px;border-radius:12px;font-size:18px;border:2px solid #64748b;background:#fff;color:#111827}label{display:block;margin-top:16px;margin-bottom:8px}#feedback{min-height:25px}a{color:#93c5fd}</style></head><body><main><h1>BIO 201 · Appendicular Muscles</h1><p>iPad-compatible name review · 48 individual muscles. This starter deck does not include the original slide images, actions, or origins/insertions.</p><div class="meta" id="status"></div><div class="card" id="card" role="button" tabindex="0" aria-label="Reveal muscle name"></div><label for="guess">Type the muscle name (optional)</label><input id="guess" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer"><p id="feedback" aria-live="polite"></p><div class="controls"><button id="miss">Review again</button><button id="know">I know it</button></div><div class="tools"><button id="reveal">Reveal</button><button id="check">Check answer</button><button id="reset">Restart</button></div></main><script>const names=["Coracobrachialis","Brachialis","Biceps brachii","Triceps brachii","Pronator teres","Flexor carpi radialis","Palmaris longus","Flexor carpi ulnaris","Flexor digitorum superficialis","Flexor digitorum profundus","Flexor pollicis longus","Pronator quadratus","Brachioradialis","Extensor carpi radialis longus","Extensor carpi radialis brevis","Extensor digitorum","Extensor carpi ulnaris","Supinator","Anconeus","Abductor pollicis longus","Extensor pollicis longus","Extensor pollicis brevis","Gluteus minimus","Gluteus medius","Gluteus maximus","Tensor fasciae latae","Psoas major","Iliacus","Sartorius","Pectineus","Adductor longus","Adductor brevis","Adductor magnus","Gracilis","Biceps femoris","Semitendinosus","Semimembranosus","Rectus femoris","Vastus medialis","Vastus intermedius","Vastus lateralis","Tibialis anterior","Extensor digitorum longus","Extensor hallucis longus","Fibularis longus","Fibularis brevis","Gastrocnemius","Soleus"];let pending=[...names.keys()],missed=[],known=new Set(),current=0,shown=false;const $=id=>document.getElementById(id);function normalize(s){return s.toLowerCase().replace(/[^a-z]/g,'')}function draw(){if(!pending.length){$('card').textContent='Finished! '+known.size+' known';$('status').textContent='Review again or restart';return}current=pending[0];shown=false;$('card').innerHTML='<div><small>Muscle '+(names.length-pending.length+1)+' · Tap to reveal</small>Recall the name</div>';$('guess').value='';$('feedback').textContent='';$('status').textContent=known.size+' known · '+pending.length+' remaining'}function reveal(){shown=true;$('card').textContent=names[current]}function next(ok){if(!pending.length)return;if(ok)known.add(current);else missed.push(current);pending.shift();if(!pending.length&&missed.length){pending=missed;missed=[]}draw()}$('card').onclick=reveal;$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal()}};$('reveal').onclick=reveal;$('check').onclick=()=>{if(!pending.length)return;const good=normalize($('guess').value)===normalize(names[current]);$('feedback').textContent=good?'Correct':'Answer: '+names[current];reveal()};$('miss').onclick=()=>next(false);$('know').onclick=()=>next(true);$('reset').onclick=()=>{pending=[...names.keys()];missed=[];known=new Set();draw()};draw();</script></body></html>
